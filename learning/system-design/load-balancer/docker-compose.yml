version: '3.8'

services:
  web1:
    build: .
    environment:
      - SERVER_NAME=instance-1
    expose:
      - "5000"

  web2:
    build: .
    environment:
      - SERVER_NAME=instance-2
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web1
      - web2
