version: '3.8'

services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - blue
      - green

  blue:
    build: ./blue
    expose:
      - "5000"

  green:
    build: ./green
    expose:
      - "5000"
